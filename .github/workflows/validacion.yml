name: Validación de Michipedia
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npm run build:web
      - run: npm audit --workspace backend --omit=dev --audit-level=moderate
